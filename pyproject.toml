[project]
name = "cygnisai-sdk-python"
version = "0.1.0"
description = "SDK Python officiel pour l'API CygnisAI"
authors = [{ name = "Simon CHUSSEAU", email = "cygnis.ai@gmail.com" }]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]
requires-python = ">=3.9"
readme = "README.md"
license = { text = "MIT" } # Ou votre licence choisie
keywords = ["cygnisai", "api", "sdk", "ai", "inference", "vision"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta" # Gardons setuptools.build_meta pour le moment, car setup.py est géré par setuptools

[tool.setuptools.packages.find]
where = ["."] # Cherche les packages dans le répertoire courant
